name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: SSH Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 120s
          command_timeout: 30m
          script: |
            echo "🚀 Starting deploy at $(date)"
            /opt/mohamy-smart/scripts/deploy.sh
            echo "✅ Deploy finished at $(date)"

      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - name: Deploy via SSH (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 120s
          command_timeout: 30m
          script: |
            echo "🚀 Starting deploy (retry) at $(date)"
            /opt/mohamy-smart/scripts/deploy.sh
            echo "✅ Deploy finished at $(date)"

      - name: Wait before final retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60

      - name: Deploy via SSH (attempt 3)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 180s
          command_timeout: 30m
          script: |
            echo "🚀 Starting deploy (final retry) at $(date)"
            /opt/mohamy-smart/scripts/deploy.sh
            echo "✅ Deploy finished at $(date)"
